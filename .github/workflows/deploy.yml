name: Deploy PHOENIX Website

on:
  push:
    branches: [main]
    paths:
      - 'phoenix-website/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phoenix-website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy static files
        run: |
          mkdir -p dist
          cp public/favicon.svg dist/
          cp public/robots.txt dist/
          cp public/404.html dist/
          cp index.html dist/
          cp docs.html dist/
          cp architecture.html dist/
          cp about.html dist/
          cp dashboard.html dist/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: phoenix-website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
