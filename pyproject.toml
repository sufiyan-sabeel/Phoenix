[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-cli"
version = "1.0.0"
description = "PHOENIX — AI All-Rounder Assistant for Termux, Linux, macOS & Windows"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Umaiz Sufiyan"}
]
keywords = ["ai", "assistant", "termux", "security", "automation", "mcp", "react"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "flask",
    "requests",
]

[project.urls]
Homepage = "https://github.com/sufiyan-sabeel/Phoenix"
Repository = "https://github.com/sufiyan-sabeel/Phoenix"
Issues = "https://github.com/sufiyan-sabeel/Phoenix/issues"

[project.scripts]
phoenix = "phoenix_ai.cli:main"

[tool.setuptools.packages.find]
include = ["phoenix_ai*"]

[tool.setuptools.package-data]
phoenix_ai = ["templates/*", "static/*"]
